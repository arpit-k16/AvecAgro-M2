services:
  - type: web
    name: avecagro
    runtime: node
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL
        value: openai/gpt-oss-120b
      - key: LIMIT_PER_HOUR
        value: "120"
